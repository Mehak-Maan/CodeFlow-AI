services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeflow_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    env_file:
      - .env
    volumes:
      - ./workspace:/app/workspace
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeflow_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
